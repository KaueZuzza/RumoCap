# Compila o projeto e roda os testes automatizados a cada envio para o GitHub.
# Os testes usam H2 em memória: não é preciso PostgreSQL nem senhas aqui.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e testar
        run: ./mvnw -B verify
