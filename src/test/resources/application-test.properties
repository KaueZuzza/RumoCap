# Configuração usada apenas pelos testes automatizados (perfil "test").
# Os testes usam um banco H2 em memória no modo PostgreSQL, então não
# alteram nada no banco real. As migrations do Flyway são executadas nele.
spring.datasource.url=jdbc:h2:mem:rumocap-teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

rumocap.upload.diretorio=target/uploads-teste
rumocap.admin.usuario=admin
rumocap.admin.senha=senha-de-teste
