spring.application.name=rumocap

# Porta do servidor (site + API)
server.port=${RUMOCAP_PORT:8080}

# Declara UTF-8 em todas as respostas: acentos corretos em qualquer cliente
# (inclusive no Invoke-RestMethod do Windows PowerShell).
spring.servlet.encoding.force-response=true

# Compacta as respostas (JSON, HTML, CSS e JS): a lista da revisão fica bem menor.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=2KB

# -----------------------------------------------------------------------------
# PostgreSQL - servidor exclusivo do RumoCap (porta 5434), criado com:
#   powershell -ExecutionPolicy Bypass -File database\servidor.ps1 criar
# Os valores podem ser trocados pelas variaveis de ambiente indicadas.
#
# As senhas nao ficam no codigo: vem de variaveis de ambiente ou do arquivo
# local config/application.properties (fora do Git), que o servidor.ps1 cria.
# Modelo: config/application.properties.example
# -----------------------------------------------------------------------------
spring.datasource.url=${RUMOCAP_DB_URL:jdbc:postgresql://localhost:5434/rumocap}
spring.datasource.username=${RUMOCAP_DB_USERNAME:rumocap}
spring.datasource.password=${RUMOCAP_DB_PASSWORD:}

# As tabelas sao criadas pelo Flyway (src/main/resources/db/migration);
# o Hibernate apenas confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Imagens dos estabelecimentos
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
rumocap.upload.diretorio=${RUMOCAP_UPLOAD_DIR:uploads}

# -----------------------------------------------------------------------------
# Area administrativa (a senha e obrigatoria; veja config/application.properties)
# -----------------------------------------------------------------------------
rumocap.admin.usuario=${RUMOCAP_ADMIN_USERNAME:admin}
rumocap.admin.senha=${RUMOCAP_ADMIN_PASSWORD:}
