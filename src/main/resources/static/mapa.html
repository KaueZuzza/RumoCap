<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa · RumoCap</title>
  <meta name="description" content="Mapa dos estabelecimentos comerciais e serviços de Capitão Poço (PA).">
  <meta name="theme-color" content="#0b1322">
  <script src="js/tema.js"></script>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/mapa.js"></script>
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="container topo__conteudo">
      <a class="marca" href="index.html" aria-label="RumoCap, página inicial">
        <img src="img/logo.svg" alt="" width="40" height="40">
        <span class="marca__texto">
          <span class="marca__nome">Rumo<span>Cap</span></span>
          <span class="marca__descricao">Guia Comercial de Capitão Poço</span>
        </span>
      </a>
      <button type="button" class="topo-botao tema-botao" data-alternar-tema aria-label="Alternar entre modo claro e escuro">
        <svg class="icone icone-lua" aria-hidden="true"><use href="img/icones.svg#moon"></use></svg>
        <svg class="icone icone-sol" aria-hidden="true"><use href="img/icones.svg#sun"></use></svg>
      </button>
      <button type="button" class="topo-botao menu-botao" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
        <svg class="icone" aria-hidden="true"><use href="img/icones.svg#menu"></use></svg>
      </button>
      <nav id="menu-principal" class="menu" aria-label="Menu principal">
        <a href="index.html"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#house"></use></svg>Início</a>
        <a href="estabelecimentos.html"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#store"></use></svg>Estabelecimentos</a>
        <a href="mapa.html" aria-current="page"><svg class="icone" aria-hidden="true"><use href="img/icones.svg#map"></use></svg>Mapa</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="pagina-mapa">
    <div id="mapa" class="mapa-completo" role="region" aria-label="Mapa dos estabelecimentos de Capitão Poço"></div>

    <section class="mapa-painel" aria-labelledby="titulo-mapa">
      <div class="mapa-painel__topo">
        <h1 id="titulo-mapa">Mapa de Capitão Poço</h1>
        <span class="mapa-painel__contagem" id="contagem-mapa" aria-live="polite"></span>
      </div>

      <form class="campo-busca" id="busca-mapa" role="search">
        <svg class="icone" aria-hidden="true"><use href="img/icones.svg#search"></use></svg>
        <label class="visualmente-oculto" for="texto-busca-mapa">Buscar estabelecimento, rua ou local</label>
        <input type="search" id="texto-busca-mapa" placeholder="Estabelecimento ou rua" autocomplete="off">
        <button type="submit" class="botao botao--primario mapa-busca__botao">Buscar</button>
      </form>
      <div class="mapa-aviso" id="aviso-mapa" role="status" hidden></div>
      <div class="resultados" id="resultados-mapa" aria-live="polite" hidden></div>

      <div>
        <p class="mapa-painel__titulo-secao" id="titulo-filtro-mapa">Categorias</p>
        <div class="chips" id="filtro-mapa" role="group" aria-labelledby="titulo-filtro-mapa"></div>
      </div>

      <details class="municipio" id="municipio">
        <summary>
          <svg class="icone" aria-hidden="true"><use href="img/icones.svg#info"></use></svg>
          Capitão Poço – PA
          <svg class="icone municipio__seta" aria-hidden="true"><use href="img/icones.svg#chevron-right"></use></svg>
        </summary>
        <div class="municipio__corpo" id="municipio-corpo">
          <p class="municipio__fonte">Carregando dados do IBGE...</p>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
